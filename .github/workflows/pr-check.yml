name: PR Ticket Validation

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title/body for ticket reference (AB#1234)
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          BODY="${{ github.event.pull_request.body }}"

          echo "🔍 Checking PR Title: $TITLE"
          echo "🔍 Checking PR Body: $BODY"

          if echo "$TITLE $BODY" | grep -Eq 'AB#[0-9]+'; then
            echo "✅ Found ticket reference."
          else
            echo "❌ Missing AB#1234 ticket reference."
            exit 1
          fi
