name: PR Ticket Validation

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title/body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$TITLE" =~ AB#[0-9]+ || "$BODY" =~ AB#[0-9]+ ]]; then
            echo "✅ Found ticket reference."
          else
            echo "❌ Missing AB#1234 ticket reference"
            exit 1
          fi
